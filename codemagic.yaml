workflows:
  android-release-bundle:
    name: December Package - Release AAB
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 21
      android_signing:
        - sonance
    scripts:
      - name: Set gradlew permissions
        script: |
          chmod +x gradlew
      - name: Build signed Release Android App Bundle (AAB)
        script: |
          KEYSTORE_PATH="${CM_KEYSTORE_PATH:-$KEYSTORE_PATH}"
          STORE_PASSWORD="${CM_KEYSTORE_PASSWORD:-$STORE_PASSWORD}"
          KEY_PASSWORD="${CM_KEY_PASSWORD:-$KEY_PASSWORD}"
          KEY_ALIAS="${CM_KEY_ALIAS:-upload}"

          echo "Using keystore: $KEYSTORE_PATH with alias: $KEY_ALIAS"

          ./gradlew :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon \
            --stacktrace
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - gilbertuzochukwu846@gmail.com
        notify:
          success: true
          failure: true
